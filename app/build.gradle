plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pl.srtkam'
    compileSdk 35

    defaultConfig {
        applicationId "pl.srtkam"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            // Staly klucz podpisujacy - dzieki niemu kolejne wersje instaluja sie
            // na wierzchu poprzedniej, bez odinstalowywania i utraty ustawien.
            storeFile file('srtkamera.jks')
            storePassword 'srtkamera'
            keyAlias 'srtkamera'
            keyPassword 'srtkamera'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }

    // ostrzezenia analizy statycznej nie moga blokowac zbudowania pliku APK
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Kody QR - generowanie i skanowanie
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Enkoder + SRT + MPEG-TS
    implementation 'com.github.pedroSG94.RootEncoder:library:2.7.2'
    // CameraUvcSource - obsluga grabbera USB
    implementation 'com.github.pedroSG94.RootEncoder:extra-sources:2.7.2'
}
