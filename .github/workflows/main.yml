name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buduj APK
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            {
              echo "## Bledy kompilacji"
              echo ''
              echo '```'
              grep -E "^e: " build.log | sed 's|file:///home/runner/work/srt-kamera/srt-kamera/||' | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Opublikuj APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: SRT Kamera - najnowsza wersja
          files: app/build/outputs/apk/release/*.apk
